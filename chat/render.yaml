services:
  # Single Service (Backend + Frontend served statically)
  - type: web
    name: chat-app
    rootDir: chat
    env: node
    plan: free
    # Build: Install dependencies for both, build frontend
    buildCommand: npm install && npm run build
    # Start: Run the server (which serves the frontend)
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
