<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Chat</title>
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/toast.css">
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <h2>Voice Chat</h2>
      <div class="header-actions">
        <!-- Placeholder for menu icon -->
        <span class="icon-menu">⋮</span>
      </div>
    </header>

    <!-- Join Screen -->
    <div id="join-screen" class="screen active">
      <div class="join-content">
        <h1>Bienvenido</h1>
        <p>Ingresa para comenzar a hablar</p>

        <div class="input-group">
          <input type="text" id="roomId" placeholder="ID de la Sala" autocomplete="off">
        </div>

        <div class="input-group">
          <input type="text" id="username" placeholder="Tu Nombre" autocomplete="off">
        </div>

        <button id="joinBtn" class="btn-primary">
          Unirse
        </button>
      </div>
    </div>

    <!-- Calls Screen -->
    <div id="call-screen" class="screen hidden">
      <div class="participants-list" id="participantsList">
        <!-- Participants will be injected here -->
      </div>

      <div class="call-controls">
        <button id="speakerBtn" class="control-btn secondary">
          🔊
          <span class="btn-label">Speaker</span>
        </button>

        <button id="muteBtn" class="control-btn primary">
          <div class="mic-container">
            <div class="mic-icon" id="micIconMain">🎤</div>
          </div>
          <span class="btn-label" id="muteText">Tap to Mute</span>
        </button>

        <button id="leaveBtn" class="control-btn danger">
          📞
          <span class="btn-label">Leave</span>
        </button>
      </div>

      <div id="status" class="status-toast hidden"></div>
      <div id="toast-container" class="toast-container"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
